# Pages CMS configuration — https://pagescms.org
# Brant edits the site at https://app.pagescms.org (sign in with GitHub). Every save publishes automatically.

media:
  input: src/assets/img/uploads
  output: /assets/img/uploads

content:
  # ------------------------------------------------------------------ Business info
  - name: site
    label: Business Info (phone, hours, address)
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - { name: name, label: Business name, type: string, required: true }
      - { name: legalName, label: Legal name (footer copyright), type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: owner, label: Owner name, type: string }
      - { name: ownerTitle, label: Owner title, type: string }
      - { name: phone, label: Phone number, type: string, required: true, description: "Use the format 660-909-7284. Updates every button and link on the site." }
      - { name: email, label: Public email (optional), type: string, description: "Leave blank to keep email off the site." }
      - { name: region, label: Region name, type: string, description: 'Used in sentences like "pest control across Central Missouri".' }
      - name: address
        label: Address
        type: object
        fields:
          - { name: street, label: Street, type: string }
          - { name: city, label: City, type: string }
          - { name: state, label: State, type: string }
          - { name: zip, label: ZIP, type: string }
      - { name: showAddress, label: Show street address on the website, type: boolean }
      - name: hours
        label: Business hours (shown on the site)
        type: object
        list: true
        fields:
          - { name: days, label: Days, type: string }
          - { name: time, label: Hours, type: string, description: 'e.g. "8:00 AM – 5:00 PM" or "Closed"' }
      - { name: openingHours, label: Business hours for Google, type: string, description: 'Short code Google reads. Mon–Fri 8–5 is "Mo-Fr 08:00-17:00". Add Saturday 9–12 like "Mo-Fr 08:00-17:00, Sa 09:00-12:00".' }
      - { name: badges, label: Trust badges (hero + sidebars), type: string, list: true }
      - { name: googleProfileUrl, label: Google Business Profile link, type: string, description: "Paste the share link to your Google Business Profile. Helps Google connect the site to your listing." }
      - { name: googleReviewUrl, label: Google review link, type: string, description: 'Your "Ask for reviews" link from Google Business Profile. Shows a "Read more reviews" button.' }
      - { name: facebookUrl, label: Facebook page link, type: string }
      - name: quoteForm
        label: Quote form
        type: object
        fields:
          - { name: web3formsKey, label: Web3Forms access key, type: string, description: "Get a free key at web3forms.com using the email that should receive quote requests. Until this is set, the form asks people to call." }
          - { name: subject, label: Email subject line, type: string }
      - { name: url, label: Website address, type: string, readonly: true }
      - { name: indexNowKey, label: IndexNow key, type: string, hidden: true }

  # ------------------------------------------------------------------ Pages
  - name: pages
    label: Pages
    type: group
    items:
      - name: home
        label: Home page
        type: file
        path: src/index.md
        format: yaml-frontmatter
        fields:
          - { name: layout, type: string, hidden: true }
          - { name: title, type: string, hidden: true }
          - { name: seoTitle, label: Google title, type: string, description: "The blue headline in Google results. Keep under ~60 characters." }
          - { name: metaDescription, label: Google description, type: text, description: "The gray text under the title in Google. Keep under ~155 characters." }
          - name: hero
            label: Top banner
            type: object
            fields:
              - { name: eyebrow, label: Small label, type: string }
              - { name: headline, label: Headline (white), type: string }
              - { name: headlineAccent, label: Headline (blue), type: string }
              - { name: subheadline, label: Subheadline, type: text }
              - { name: intro, label: Intro paragraph, type: text }
          - name: services
            label: Services section
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
          - name: residential
            label: Residential box
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: points, label: Bullet points, type: string, list: true }
              - { name: button, label: Button text, type: string }
          - name: commercial
            label: Commercial box
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: points, label: Bullet points, type: string, list: true }
              - { name: button, label: Button text, type: string }
          - name: areas
            label: Service areas section
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: note, label: Note under the list, type: text }
          - name: about
            label: About section
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: image, label: Photo, type: image, description: "Tall (portrait) photos work best." }
              - { name: imageAlt, label: Photo description (for Google & screen readers), type: string }
              - { name: text, label: Text, type: rich-text, options: { format: markdown, media: false } }
          - name: cta
            label: Bottom call-to-action
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
          - name: faqs
            label: FAQs
            type: object
            list: { collapsible: { summary: "{fields.q}" } }
            fields:
              - { name: q, label: Question, type: string }
              - { name: a, label: Answer, type: text }

      - name: residential
        label: Residential page
        type: file
        path: src/residential.md
        format: yaml-frontmatter
        fields:
          - { name: layout, type: string, hidden: true }
          - { name: title, label: Page name, type: string, readonly: true }
          - { name: navTitle, type: string, hidden: true }
          - { name: eyebrow, label: Small label, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: seoTitle, label: Google title, type: string }
          - { name: metaDescription, label: Google description, type: text }
          - { name: body, label: Main text, type: rich-text, options: { format: markdown, media: false } }
          - name: features
            label: Checklists
            type: object
            list: { collapsible: { summary: "{fields.title}" } }
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text (optional), type: text }
              - { name: items, label: Items, type: string, list: true }
          - { name: plansTitle, label: Plans section title, type: string }
          - { name: plansIntro, label: Plans section intro, type: text }
          - name: plans
            label: Service plans
            type: object
            list: { collapsible: { summary: "{fields.name}" } }
            fields:
              - { name: name, label: Plan name, type: string }
              - { name: featured, label: Highlight as "Most Popular", type: boolean }
              - { name: price, label: Price (optional), type: string, description: 'e.g. "$69/month". Leave blank to show "Call for pricing".' }
              - { name: text, label: Short description, type: text }
              - { name: features, label: Included, type: string, list: true }
          - { name: showServices, label: Show service cards, type: boolean }
          - { name: servicesTitle, label: Service cards title, type: string }
          - { name: showWhy, label: Show "Why choose us", type: boolean }
          - name: faqs
            label: FAQs
            type: object
            list: { collapsible: { summary: "{fields.q}" } }
            fields:
              - { name: q, label: Question, type: string }
              - { name: a, label: Answer, type: text }
          - name: cta
            label: Bottom call-to-action
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }

      - name: commercial
        label: Commercial page
        type: file
        path: src/commercial.md
        format: yaml-frontmatter
        fields:
          - { name: layout, type: string, hidden: true }
          - { name: title, label: Page name, type: string, readonly: true }
          - { name: navTitle, type: string, hidden: true }
          - { name: eyebrow, label: Small label, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: seoTitle, label: Google title, type: string }
          - { name: metaDescription, label: Google description, type: text }
          - { name: body, label: Main text, type: rich-text, options: { format: markdown, media: false } }
          - name: features
            label: Checklists
            type: object
            list: { collapsible: { summary: "{fields.title}" } }
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text (optional), type: text }
              - { name: items, label: Items, type: string, list: true }
          - { name: plansTitle, label: Plans section title, type: string }
          - { name: plansIntro, label: Plans section intro, type: text }
          - name: plans
            label: Service plans
            type: object
            list: { collapsible: { summary: "{fields.name}" } }
            fields:
              - { name: name, label: Plan name, type: string }
              - { name: featured, label: Highlight as "Most Popular", type: boolean }
              - { name: price, label: Price (optional), type: string, description: 'e.g. "$69/month". Leave blank to show "Call for pricing".' }
              - { name: text, label: Short description, type: text }
              - { name: features, label: Included, type: string, list: true }
          - { name: showServices, label: Show service cards, type: boolean }
          - { name: servicesTitle, label: Service cards title, type: string }
          - { name: showWhy, label: Show "Why choose us", type: boolean }
          - name: faqs
            label: FAQs
            type: object
            list: { collapsible: { summary: "{fields.q}" } }
            fields:
              - { name: q, label: Question, type: string }
              - { name: a, label: Answer, type: text }
          - name: cta
            label: Bottom call-to-action
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }

      - name: about
        label: About page
        type: file
        path: src/about.md
        format: yaml-frontmatter
        fields:
          - { name: layout, type: string, hidden: true }
          - { name: title, label: Page name, type: string, readonly: true }
          - { name: navTitle, type: string, hidden: true }
          - { name: eyebrow, label: Small label, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: seoTitle, label: Google title, type: string }
          - { name: metaDescription, label: Google description, type: text }
          - { name: body, label: Main text, type: rich-text, options: { format: markdown, media: false } }
          - name: features
            label: Checklists
            type: object
            list: { collapsible: { summary: "{fields.title}" } }
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text (optional), type: text }
              - { name: items, label: Items, type: string, list: true }
          - { name: plansTitle, label: Plans section title, type: string }
          - { name: plansIntro, label: Plans section intro, type: text }
          - name: plans
            label: Service plans
            type: object
            list: { collapsible: { summary: "{fields.name}" } }
            fields:
              - { name: name, label: Plan name, type: string }
              - { name: featured, label: Highlight as "Most Popular", type: boolean }
              - { name: price, label: Price (optional), type: string, description: 'e.g. "$69/month". Leave blank to show "Call for pricing".' }
              - { name: text, label: Short description, type: text }
              - { name: features, label: Included, type: string, list: true }
          - { name: showServices, label: Show service cards, type: boolean }
          - { name: servicesTitle, label: Service cards title, type: string }
          - { name: showWhy, label: Show "Why choose us", type: boolean }
          - name: faqs
            label: FAQs
            type: object
            list: { collapsible: { summary: "{fields.q}" } }
            fields:
              - { name: q, label: Question, type: string }
              - { name: a, label: Answer, type: text }
          - name: cta
            label: Bottom call-to-action
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }

  # ------------------------------------------------------------------ Services
  - name: services
    label: Services
    type: collection
    path: src/services
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [services.11tydata.js]
    view:
      primary: title
      fields: [title, order, cityPages]
      sort: [order, title]
      default: { sort: order, order: asc }
    fields:
      - { name: title, label: Service name, type: string, required: true }
      - { name: shortTitle, label: Short name, type: string, description: 'Used in links and city pages, e.g. "Bed Bug Treatment".' }
      - { name: headline, label: Page headline, type: string }
      - { name: order, label: Order on the site, type: number, description: "1 shows first." }
      - name: icon
        label: Icon
        type: select
        options:
          values: [termite, bedbug, mosquito, ant, roach, spider, wasp, wildlife, snake, shield, home, building, spray, crosshair]
      - { name: hidden, label: Hide this service, type: boolean }
      - { name: cityPages, label: Create city pages for this service, type: boolean, description: 'Makes a page like "Termite Control in Sedalia, MO" for every city marked Featured.' }
      - { name: summary, label: One-line summary (cards), type: text }
      - { name: intro, label: Intro paragraph, type: text }
      - { name: includes, label: What's included, type: string, list: true }
      - { name: signsTitle, label: Warning signs title, type: string }
      - { name: signs, label: Warning signs, type: string, list: true }
      - { name: cityIntro, label: City page intro, type: text, description: "Write {city} where the city name should go." }
      - { name: seoTitle, label: Google title, type: string }
      - { name: metaDescription, label: Google description, type: text }
      - { name: seoName, label: Google name on city pages (optional), type: string }
      - { name: seoSuffix, label: Google title ending on city pages, type: string }
      - { name: metaPitch, label: Google description sentence on city pages, type: string }
      - name: faqs
        label: FAQs
        type: object
        list: { collapsible: { summary: "{fields.q}" } }
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
      - { name: body, label: Main text, type: rich-text, options: { format: markdown, media: false } }

  # ------------------------------------------------------------------ Cities
  - name: areas
    label: Service Areas (cities)
    type: collection
    path: src/areas
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [areas.11tydata.js]
    view:
      primary: name
      fields: [name, county, featured, order]
      sort: [order, name]
      default: { sort: order, order: asc }
    fields:
      - { name: name, label: City name, type: string, required: true, description: 'Just the town, e.g. "Oak Grove".' }
      - { name: county, label: County, type: string, description: 'e.g. "Jackson County"' }
      - { name: order, label: Order on the site, type: number }
      - { name: featured, label: Featured city, type: boolean, description: "Featured cities get the service + city pages and appear in the Service Areas menu." }
      - { name: hidden, label: Hide this city, type: boolean }
      - { name: hq, label: Home base (center of the map), type: boolean, hidden: true }
      - { name: lat, label: Latitude, type: number, description: "For the map. In Google Maps, right-click the town and click the numbers to copy them; the first number goes here." }
      - { name: lng, label: Longitude, type: number, description: "The second number (negative, like -93.73)." }
      - name: mapLabel
        label: Map label position
        type: select
        options: { values: [right, left, top, bottom] }
      - { name: intro, label: Local intro (make it unique to this town), type: text }
      - { name: pestNotes, label: Common pest problems here, type: text }
      - { name: seoTitle, label: Google title (optional), type: string }
      - { name: metaDescription, label: Google description (optional), type: text }
      - { name: body, label: Extra text (optional), type: rich-text, options: { format: markdown, media: false } }

  # ------------------------------------------------------------------ Shared sections
  - name: sections
    label: Shared sections
    type: group
    items:
      - name: reviews
        label: Customer reviews
        type: file
        path: src/_data/reviews.json
        format: json
        list: true
        fields:
          - { name: name, label: Customer name, type: string, description: 'First name + last initial is fine, e.g. "Sarah M."' }
          - { name: city, label: City, type: string }
          - { name: rating, label: Stars, type: number }
          - { name: text, label: Review, type: text, description: "Copy real reviews from Google (with the customer's OK)." }

      - name: why
        label: Why choose us
        type: file
        path: src/_data/why.json
        format: json
        fields:
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
          - name: points
            label: Reasons
            type: object
            list: { collapsible: { summary: "{fields.title}" } }
            fields:
              - { name: icon, label: Icon, type: select, options: { values: [shield, handshake, building, family, bolt, calendar, home, crosshair, check, clock, pin, phone, spray] } }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }

      - name: process
        label: Our process
        type: file
        path: src/_data/process.json
        format: json
        fields:
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
          - name: steps
            label: Steps
            type: object
            list: { collapsible: { summary: "{fields.title}" } }
            fields:
              - { name: icon, label: Icon, type: select, options: { values: [search, crosshair, spray, shield, check, calendar, home] } }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
